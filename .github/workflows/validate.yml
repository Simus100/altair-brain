name: validate clean distribution
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      ALTAIR_BRAIN: brains/starter
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install verification dependencies
        run: pip install pytest jsonschema httpx fastapi graphifyy==0.9.2
      - name: Ensure acquired brains are not published
        run: python tools/check_distribution.py
      - name: Rebuild the virgin brain
        run: python tools/rebuild_all.py
      - name: Test the engine against the virgin brain and synthetic fixtures
        run: python -m pytest tests/ -q
      - name: Validate the optional training separately
        run: |
          python tools/brain_new.py --nome ci-training --aree notes --training aion
          ALTAIR_BRAIN=brains/ci-training python tools/rebuild_all.py
          ALTAIR_BRAIN=brains/ci-training python -m pytest tests/ -q
      - name: Check syntax
        run: python -m compileall -q tools server tests
  # Rete di sicurezza: il branch `backup` punta SEMPRE all'ultimo commit di main
  # che ha passato l'intera validazione. Se main viene corrotto (push errato,
  # regressione, riscrittura), backup conserva l'ultimo stato certificato buono.
  backup:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5   # v4.3.1
        with:
          fetch-depth: 0   # servono tutti gli oggetti per aggiornare il ref remoto
      - name: Aggiorna branch backup all'ultimo main validato
        run: |
          git push --force origin HEAD:backup
          echo "backup -> $(git rev-parse --short HEAD)"

      # RITENZIONE. `backup` si sovrascrive a ogni CI verde: protegge dal main
      # INVALIDO, non dal main SBAGLIATO. Un errore di contenuto che passa la CI
      # (un fatto errato, una nota cancellata per sbaglio) distrugge subito l'unico
      # punto di ripristino. Un tag settimanale immutabile da profondita storica.
      - name: Punto di ripristino settimanale (immutabile)
        run: |
          TAG="ripristino-$(date -u +%Y-w%V)"
          if git ls-remote --exit-code --tags origin "$TAG" >/dev/null 2>&1; then
            echo "$TAG esiste gia: la settimana e gia coperta"
          else
            # Tag LEGGERO di proposito: quello annotato (-a -m) richiede un'identita
            # git, che un checkout pulito in Actions non ha — ed e esattamente cosi
            # che questo step e fallito al primo giro. Per un punto di ripristino
            # l'annotazione non aggiunge nulla: conta il commit a cui punta.
            git tag "$TAG"
            git push origin "$TAG"
            echo "creato $TAG -> $(git rev-parse --short HEAD)"
          fi
